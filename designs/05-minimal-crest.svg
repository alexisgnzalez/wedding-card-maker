<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 500 500" 
     width="50mm" 
     height="50mm"
     shape-rendering="geometricPrecision" 
     text-rendering="geometricPrecision">
  
    <defs>
      <!-- Drop shadows for paper effect -->
      <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" flood-color="#3d2a24"/>
      </filter>

      <!-- Rose Petals Gradients -->
      <radialGradient id="rose-blush-center" cx="45%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFF0ED"/>
        <stop offset="35%" stop-color="#F7C9C2"/>
        <stop offset="70%" stop-color="#E89F95"/>
        <stop offset="100%" stop-color="#C7756B"/>
      </radialGradient>

      <linearGradient id="rose-petal-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF5F2"/>
        <stop offset="50%" stop-color="#F5CECA"/>
        <stop offset="100%" stop-color="#D98E84"/>
      </linearGradient>

      <linearGradient id="rose-petal-grad-2" x1="0%" y1="100%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#F2BFB8"/>
        <stop offset="60%" stop-color="#EAAFA6"/>
        <stop offset="100%" stop-color="#FFF0EB"/>
      </linearGradient>

      <!-- Cream / Ivory Rose Gradient -->
      <radialGradient id="cream-rose-grad" cx="40%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFFFFA"/>
        <stop offset="40%" stop-color="#F6EFE3"/>
        <stop offset="75%" stop-color="#E8DCB9"/>
        <stop offset="100%" stop-color="#CBB792"/>
      </radialGradient>

      <!-- Eucalyptus Foliage Gradients -->
      <linearGradient id="eucalyptus-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C8D6BE"/>
        <stop offset="45%" stop-color="#93A987"/>
        <stop offset="100%" stop-color="#607755"/>
      </linearGradient>

      <linearGradient id="eucalyptus-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#B2C4A7"/>
        <stop offset="50%" stop-color="#7C9470"/>
        <stop offset="100%" stop-color="#4C6242"/>
      </linearGradient>

      <linearGradient id="olive-leaf-grad" x1="0%" y1="0%" x2="100%" y2="80%">
        <stop offset="0%" stop-color="#D0DCBC"/>
        <stop offset="50%" stop-color="#A4B38C"/>
        <stop offset="100%" stop-color="#72825B"/>
      </linearGradient>

      <!-- Gold Foil Gradient -->
      <linearGradient id="gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#EED79A"/>
        <stop offset="35%" stop-color="#D4AF37"/>
        <stop offset="70%" stop-color="#AA7F1A"/>
        <stop offset="100%" stop-color="#F7E2B0"/>
      </linearGradient>

      <!-- Rose Gold Foil -->
      <linearGradient id="rose-gold-foil" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F8D3C5"/>
        <stop offset="40%" stop-color="#D99B87"/>
        <stop offset="75%" stop-color="#B76E5B"/>
        <stop offset="100%" stop-color="#F3C5B5"/>
      </linearGradient>

      <!-- Metallic Tagpin Gradient -->
      <linearGradient id="pin-gold" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF1C5"/>
        <stop offset="50%" stop-color="#D4AF37"/>
        <stop offset="100%" stop-color="#8C6A18"/>
      </linearGradient>
    </defs>
  

  <!-- Circular Die-cut Mask & Background -->
  <clipPath id="circle-cutout">
    <circle cx="250" cy="250" r="248"/>
  </clipPath>

  <g id="card-content" clip-path="url(#circle-cutout)">
    <!-- Base Background Circle -->
    <circle cx="250" cy="250" r="250" fill="#FFFFFF"/>

    <!-- Optional Decorative Inner Border Ring -->
    
      <circle cx="250" cy="250" r="240" fill="none" stroke="#EDE5DC" stroke-width="1.2" opacity="0.75"/>
      <circle cx="250" cy="250" r="236" fill="none" stroke="#EDE5DC" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.6"/>
    

    <!-- Botanical Floral Artwork Layer -->
    
        <g id="minimal-crest-group">
          <circle cx="250" cy="250" r="222" fill="none" stroke="#C89758" stroke-width="1.2" opacity="0.4"/>
          <!-- Top Laurel Arch -->
          
    <g transform="translate(230, 75) scale(0.6) rotate(-75)">
      <path d="M0,0 Q10,-20 12,-55 Q14,-80 5,-105" fill="none" stroke="url(#gold-foil)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Golden berries & mini leaves -->
      <circle cx="8" cy="-22" r="3.2" fill="url(#gold-foil)"/>
      <circle cx="3" cy="-38" r="2.8" fill="url(#gold-foil)"/>
      <circle cx="16" cy="-56" r="3.5" fill="url(#gold-foil)"/>
      <circle cx="9" cy="-78" r="3" fill="url(#gold-foil)"/>
      <circle cx="5" cy="-105" r="3.8" fill="url(#gold-foil)"/>
      <!-- Delicate gold leaflets -->
      <path d="M9,-22 Q16,-26 20,-24 Q18,-18 9,-22" fill="url(#gold-foil)"/>
      <path d="M3,-38 Q-5,-42 -8,-40 Q-6,-34 3,-38" fill="url(#gold-foil)"/>
      <path d="M16,-56 Q24,-60 27,-57 Q25,-52 16,-56" fill="url(#gold-foil)"/>
    </g>
  
          
    <g transform="translate(270, 75) scale(0.6) rotate(75)">
      <path d="M0,0 Q10,-20 12,-55 Q14,-80 5,-105" fill="none" stroke="url(#gold-foil)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Golden berries & mini leaves -->
      <circle cx="8" cy="-22" r="3.2" fill="url(#gold-foil)"/>
      <circle cx="3" cy="-38" r="2.8" fill="url(#gold-foil)"/>
      <circle cx="16" cy="-56" r="3.5" fill="url(#gold-foil)"/>
      <circle cx="9" cy="-78" r="3" fill="url(#gold-foil)"/>
      <circle cx="5" cy="-105" r="3.8" fill="url(#gold-foil)"/>
      <!-- Delicate gold leaflets -->
      <path d="M9,-22 Q16,-26 20,-24 Q18,-18 9,-22" fill="url(#gold-foil)"/>
      <path d="M3,-38 Q-5,-42 -8,-40 Q-6,-34 3,-38" fill="url(#gold-foil)"/>
      <path d="M16,-56 Q24,-60 27,-57 Q25,-52 16,-56" fill="url(#gold-foil)"/>
    </g>
  
          <!-- Bottom Laurel Arch -->
          
    <g transform="translate(230, 435) scale(0.6) rotate(-105)">
      <path d="M0,0 Q10,-20 12,-55 Q14,-80 5,-105" fill="none" stroke="url(#gold-foil)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Golden berries & mini leaves -->
      <circle cx="8" cy="-22" r="3.2" fill="url(#gold-foil)"/>
      <circle cx="3" cy="-38" r="2.8" fill="url(#gold-foil)"/>
      <circle cx="16" cy="-56" r="3.5" fill="url(#gold-foil)"/>
      <circle cx="9" cy="-78" r="3" fill="url(#gold-foil)"/>
      <circle cx="5" cy="-105" r="3.8" fill="url(#gold-foil)"/>
      <!-- Delicate gold leaflets -->
      <path d="M9,-22 Q16,-26 20,-24 Q18,-18 9,-22" fill="url(#gold-foil)"/>
      <path d="M3,-38 Q-5,-42 -8,-40 Q-6,-34 3,-38" fill="url(#gold-foil)"/>
      <path d="M16,-56 Q24,-60 27,-57 Q25,-52 16,-56" fill="url(#gold-foil)"/>
    </g>
  
          
    <g transform="translate(270, 435) scale(0.6) rotate(105)">
      <path d="M0,0 Q10,-20 12,-55 Q14,-80 5,-105" fill="none" stroke="url(#gold-foil)" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Golden berries & mini leaves -->
      <circle cx="8" cy="-22" r="3.2" fill="url(#gold-foil)"/>
      <circle cx="3" cy="-38" r="2.8" fill="url(#gold-foil)"/>
      <circle cx="16" cy="-56" r="3.5" fill="url(#gold-foil)"/>
      <circle cx="9" cy="-78" r="3" fill="url(#gold-foil)"/>
      <circle cx="5" cy="-105" r="3.8" fill="url(#gold-foil)"/>
      <!-- Delicate gold leaflets -->
      <path d="M9,-22 Q16,-26 20,-24 Q18,-18 9,-22" fill="url(#gold-foil)"/>
      <path d="M3,-38 Q-5,-42 -8,-40 Q-6,-34 3,-38" fill="url(#gold-foil)"/>
      <path d="M16,-56 Q24,-60 27,-57 Q25,-52 16,-56" fill="url(#gold-foil)"/>
    </g>
  
        </g>
      

    <!-- Top Romantic Flourish with Heart -->
    
    <g id="top-heart-flourish" transform="translate(250, 90)">
      <!-- Center Heart -->
      <path d="M0,-2 C-1.8,-6.5 -7.5,-7.5 -9.5,-3 C-11.5,1.5 -5,7 0,11.5 C5,7 11.5,1.5 9.5,-3 C7.5,-7.5 1.8,-6.5 0,-2 Z" fill="#C89758"/>
      
      <!-- Left Swirl -->
      <path d="M-15,4 C-28,4 -42,10 -58,3 C-68,-2 -78,-3 -88,1 C-92,3 -94,6 -91,7 C-88,8 -83,5 -79,4 C-71,2 -64,3 -56,7 C-44,12 -30,8 -17,6" 
            fill="none" stroke="#C89758" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="-92" cy="5" r="1.6" fill="#C89758"/>

      <!-- Right Swirl -->
      <path d="M15,4 C28,4 42,10 58,3 C68,-2 78,-3 88,1 C92,3 94,6 91,7 C88,8 83,5 79,4 C71,2 64,3 56,7 C44,12 30,8 17,6" 
            fill="none" stroke="#C89758" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="92" cy="5" r="1.6" fill="#C89758"/>
    </g>
  

    <!-- Names Section: "Saray & Michael" -->
    <g id="names-group" text-anchor="middle">
      
        <text x="250" y="144">
          <tspan font-family="'Cinzel', serif" font-size="36" fill="#1A1A1A" font-weight="normal">Saray</tspan>
          <tspan font-family="'Alex Brush', cursive" font-size="38" fill="#C89758" font-weight="normal"> & </tspan>
          <tspan font-family="'Cinzel', serif" font-size="36" fill="#1A1A1A" font-weight="normal">Michael</tspan>
        </text>
      
    </g>

    <!-- Mini Accent Dot/Heart under names -->
    <circle cx="250" cy="162" r="2.5" fill="#C89758" opacity="0.85"/>
    <line x1="215" y1="162" x2="242" y2="162" stroke="#C89758" stroke-width="0.8" opacity="0.6"/>
    <line x1="258" y1="162" x2="285" y2="162" stroke="#C89758" stroke-width="0.8" opacity="0.6"/>

    <!-- Greeting Section: "Gracias por" -->
    <text id="greeting-text" 
          x="250" 
          y="198" 
          font-family="'Montserrat', sans-serif" 
          font-size="16" 
          fill="#3A3430" 
          letter-spacing="1.5" 
          text-anchor="middle"
          font-weight="400">
      Gracias por
    </text>

    <!-- Highlighted Calligraphy: "acompañarnos" -->
    <text id="highlight-text" 
          x="250" 
          y="238" 
          font-family="'Alex Brush', cursive" 
          font-size="30" 
          fill="#8A5D3B" 
          text-anchor="middle"
          font-weight="normal">
      acompañarnos
    </text>

    <!-- Tiny Heart under acompañarnos -->
    <path transform="translate(250, 264) scale(0.65)"
          d="M0,-2 C-1.8,-6.5 -7.5,-7.5 -9.5,-3 C-11.5,1.5 -5,7 0,11.5 C5,7 11.5,1.5 9.5,-3 C7.5,-7.5 1.8,-6.5 0,-2 Z" 
          fill="#C89758" opacity="0.75"/>

    <!-- Thank you Message / Body: "Tu presencia hizo este día aún más especial." -->
    <g id="message-group" text-anchor="middle">
      
    <text x="250" y="298" font-family="'Cormorant Garamond', serif" font-size="14" fill="#524B45" font-style="italic">
      <tspan x="250" dy="0">Tu presencia hizo este</tspan>
      <tspan x="250" dy="18.900000000000002">día aún más especial.</tspan>
    </text>
  
    </g>

    <!-- Date Divider with Laurels & Heart -->
    
    <g id="bottom-laurel-divider" transform="translate(250, 372)">
      <!-- Mini Central Heart -->
      <path d="M0,-1 C-1.2,-4.5 -5,-5 -6.5,-2 C-8,1 -3.5,4.8 0,8 C3.5,4.8 8,1 6.5,-2 C5,-5 1.2,-4.5 0,-1 Z" fill="#C89758"/>
      
      <!-- Left side sprig -->
      <path d="M-12,3 L-55,3" stroke="#C89758" stroke-width="1" stroke-linecap="round"/>
      <path d="M-22,3 Q-28,-2 -32,0 Q-29,4 -22,3" fill="#C89758"/>
      <path d="M-34,3 Q-40,-2 -44,0 Q-41,4 -34,3" fill="#C89758"/>
      <circle cx="-59" cy="3" r="1.8" fill="#C89758"/>
      
      <!-- Right side sprig -->
      <path d="M12,3 L55,3" stroke="#C89758" stroke-width="1" stroke-linecap="round"/>
      <path d="M22,3 Q28,-2 32,0 Q29,4 22,3" fill="#C89758"/>
      <path d="M34,3 Q40,-2 44,0 Q41,4 34,3" fill="#C89758"/>
      <circle cx="59" cy="3" r="1.8" fill="#C89758"/>
    </g>
  

    <!-- Date: "24 · Noviembre · 2026" -->
    <text id="date-text" 
          x="250" 
          y="400" 
          font-family="'Montserrat', sans-serif" 
          font-size="12" 
          fill="#6B625A" 
          letter-spacing="2.2" 
          text-anchor="middle"
          font-weight="500">
      24 · Noviembre · 2026
    </text>
  </g>

  <!-- Hole Punch Guide & Tagpin Layer (Can be toggled or exported) -->
  

  <!-- Outer Die-Cut Circular Cutline (Clean subtle guideline) -->
  <circle cx="250" cy="250" r="249" fill="none" stroke="#D8CFC4" stroke-width="0.8" opacity="0.5"/>
</svg>